<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="vinyl-body" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e0711" />
      <stop offset="40%" stop-color="#180e1c" />
      <stop offset="70%" stop-color="#100813" />
      <stop offset="100%" stop-color="#08040a" />
    </radialGradient>
    <radialGradient id="label-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="65%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </radialGradient>
  </defs>
  <!-- Outer vinyl edge -->
  <circle cx="250" cy="250" r="248" fill="url(#vinyl-body)" stroke="#831843" stroke-width="3"/>
  <!-- Concentric Grooves -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="250" cy="250" r="224" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.2"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <circle cx="250" cy="250" r="188" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <circle cx="250" cy="250" r="164" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <circle cx="250" cy="250" r="152" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="1.2"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <circle cx="250" cy="250" r="128" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <circle cx="250" cy="250" r="116" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1"/>
  <circle cx="250" cy="250" r="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
  <!-- Run-out groove -->
  <circle cx="250" cy="250" r="95" fill="none" stroke="#2a0d1d" stroke-width="8"/>
  <circle cx="250" cy="250" r="92" fill="none" stroke="rgba(244,114,182,0.18)" stroke-width="0.8"/>
  <!-- Center Record Label (Neon Pink) -->
  <circle cx="250" cy="250" r="80" fill="url(#label-grad)" stroke="#1f0714" stroke-width="2"/>
  <circle cx="250" cy="250" r="74" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Musify Note Icon on Label -->
  <g transform="translate(250, 250) scale(2.8) translate(-12, -12)">
    <path fill="#ffffff" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </g>
  <!-- Center Spindle Hole -->
  <circle cx="250" cy="250" r="16" fill="#0d0811" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="8" fill="#000000"/>
</svg>
