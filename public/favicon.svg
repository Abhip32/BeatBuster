<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0f0f13"/>
  <path d="M22 52 C22 34 34 22 50 22 C66 22 78 34 78 52" fill="none" stroke="url(#roseGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Ear cups -->
  <rect x="16" y="48" width="12" height="24" rx="6" fill="url(#roseGrad)" filter="url(#glow)"/>
  <rect x="72" y="48" width="12" height="24" rx="6" fill="url(#roseGrad)" filter="url(#glow)"/>
  <!-- Inner headphone pads -->
  <rect x="23" y="52" width="4" height="16" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="73" y="52" width="4" height="16" rx="2" fill="#ffffff" opacity="0.8"/>
  <!-- Center sound dot -->
  <circle cx="50" cy="58" r="6" fill="#f43f5e"/>
</svg>